<div id="player-container" style="width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden;">
    <div id="display-area" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
        <p style="color: #666;">Bấm XEM NGAY để bắt đầu...</p>
    </div>
</div>

<script>
    function renderPlayer(url) {
        const area = document.getElementById('display-area');
        if (url.includes('youtube.com') || url.includes('youtu.be') || url.includes('embed/')) {
            let videoId = url.split('/').pop().split('?')[0].replace('v=', '');
            area.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${videoId}?autoplay=1" frameborder="0" allowfullscreen></iframe>`;
        } else {
            area.innerHTML = `<video width="100%" height="100%" controls autoplay><source src="${url}" type="video/mp4"></video>`;
        }
    }
    function playNow(videoUrl) {
        renderPlayer(videoUrl);
    }
</script>
