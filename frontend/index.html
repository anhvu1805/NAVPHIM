<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVPHIM - Cinema 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo-box">
                <img src="logo.jpg" alt="NAVPHIM" class="my-logo">
            </div>
            
            <nav>
                <button onclick="loadMovies()"><i class="fas fa-home"></i> Trang chủ</button>
                <button onclick="filterByYear(2024)"><i class="fas fa-history"></i> Phim 2024</button>
                <button onclick="filterByYear(2025)"><i class="fas fa-calendar-alt"></i> Phim 2025</button>
                <button onclick="filterByYear(2026)"><i class="fas fa-film"></i> Phim 2026</button>
            </nav>
        </aside>

        <main class="content">
            <header>
                <h2 id="category-title">Phim Mới Cập Nhật</h2>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Tìm tên phim, thể loại..." onkeyup="searchMovies()">
                    <button><i class="fas fa-search"></i></button>
                </div>
            </header>

            <div id="movie-grid" class="movie-grid">
                </div>
        </main>
    </div>

    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body">
                </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
