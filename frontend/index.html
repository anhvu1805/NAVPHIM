<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVPHIM - Cinema 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>
        document.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("keydown", function (e) {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "u")) e.preventDefault();
        });
    </script>

    <div class="app">
        <aside class="sidebar">
            <div class="logo-box">
                <img src="logo.jpg" alt="NAVPHIM" class="my-logo" onerror="this.src='https://via.placeholder.com/150x50?text=NAVPHIM'">
            </div>
            <nav>
                <button onclick="loadMovies()"><i class="fas fa-home"></i> Trang chủ</button>
                <button onclick="filterByYear(2024)"><i class="fas fa-calendar-alt"></i> Phim 2024</button>
                <button onclick="filterByYear(2025)"><i class="fas fa-calendar-alt"></i> Phim 2025</button>
                <button onclick="filterByYear(2026)"><i class="fas fa-film"></i> Phim 2026</button>
                
                <hr style="border: 0.5px solid #333; margin: 20px 0;">
                
                <div id="user-section">
                    </div>
            </nav>
        </aside>

        <main class="content">
            <header>
                <h2 id="category-title">Phim Mới Cập Nhật</h2>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Tìm tên phim..." onkeyup="searchMovies()">
                    <button onclick="searchMovies()"><i class="fas fa-search"></i></button>
                </div>
            </header>
            
            <div id="movie-grid" class="movie-grid"></div>
        </main>
    </div>

    <div id="movieModal" class="modal" onclick="if(event.target == this) closeModal()">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <div id="cinema-room" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 9999; overflow-y: auto;">
        <div style="padding: 20px;">
            <button onclick="closeCinema()" style="background: #e50914; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 4px; margin-bottom: 20px; font-weight: bold; transition: 0.3s;">
                <i class="fas fa-arrow-left"></i> QUAY LẠI
            </button>
            
            <div style="max-width: 1100px; margin: 0 auto;">
                <div id="cinema-video-container" style="width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.5);"></div>
                
                <div style="margin-top: 30px; color: white; padding-bottom: 50px;">
                    <h1 id="cinema-title" style="font-size: 2.5rem; margin-bottom: 10px;"></h1>
                    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                        <p id="cinema-meta" style="color: #46d369; font-size: 1.1rem; font-weight: bold;"></p>
                        <span id="cinema-quality" style="background: #e50914; padding: 2px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem;"></span>
                    </div>
                    <p id="cinema-desc" style="color: #aaa; line-height: 1.8; font-size: 1.05rem; max-width: 900px;"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="authModal" class="modal" style="display:none; align-items: center; justify-content: center;">
        <div class="modal-content" style="max-width: 400px; background: #181818; padding: 30px; border-radius: 8px;">
            <span class="close-btn" onclick="closeAuth()">&times;</span>
            
            <div class="auth-tabs" style="display: flex; margin-bottom: 25px; border-bottom: 1px solid #333;">
                <button onclick="switchAuth('login')" id="tabLogin" style="flex: 1; padding: 12px; background: none; border: none; color: white; cursor: pointer; border-bottom: 2px solid #e50914; font-weight: bold; transition: 0.3s;">Đăng nhập</button>
                <button onclick="switchAuth('register')" id="tabRegister" style="flex: 1; padding: 12px; background: none; border: none; color: #888; cursor: pointer; font-weight: bold; transition: 0.3s;">Đăng ký</button>
            </div>

            <form id="loginForm">
                <input type="text" id="loginUser" placeholder="Tên đăng nhập" required style="width: 100%; padding: 12px; margin-bottom: 15px; background: #333; border: 1px solid #444; color: white; border-radius: 4px;">
                <input type="password" id="loginPass" placeholder="Mật khẩu" required style="width: 100%; padding: 12px; margin-bottom: 20px; background: #333; border: 1px solid #444; color: white; border-radius: 4px;">
                <button type="submit" style="width: 100%; padding: 12px; background: #e50914; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">ĐĂNG NHẬP</button>
            </form>

            <form id="registerForm" style="display: none;">
                <input type="text" id="regUser" placeholder="Tên đăng nhập" required style="width: 100%; padding: 12px; margin-bottom: 15px; background: #333; border: 1px solid #444; color: white; border-radius: 4px;">
                <input type="email" id="regEmail" placeholder="Email" required style="width: 100%; padding: 12px; margin-bottom: 15px; background: #333; border: 1px solid #444; color: white; border-radius: 4px;">
                <input type="password" id="regPass" placeholder="Mật khẩu" required style="width: 100%; padding: 12px; margin-bottom: 20px; background: #333; border: 1px solid #444; color: white; border-radius: 4px;">
                <button type="submit" style="width: 100%; padding: 12px; background: #e50914; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">TẠO TÀI KHOẢN</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
